[project]
name = "finsense"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "beautifulsoup4==4.15.0",
    "certifi==2025.11.12",
    "feedparser==6.0.12",
    "google-api-core>=2.19.0",
    "httpx==0.28.1",
    "langchain-core==1.5.3",
    "langchain-google-genai==4.3.2",
    "motor==3.7.1",
    "numpy==2.5.1",
    "protobuf==7.35.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymongo==4.17.0",
    "requests==2.34.2",
    "sentence-transformers==5.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "mongomock>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]