[tool.poetry]
name = "finsense-backend"
version = "0.1.0"
description = "Fin-Sense backend pipeline"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
requests = "^2.32.5"
beautifulsoup4 = "^4.15.0"
pymongo = "^4.17.0"
feedparser = "^6.0.12"
uvicorn = "<0.40"
pytest = "<9.0"
fastapi = "<0.129"
pydantic-settings = "<2.12"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: hits the real Gemini API, costs quota"]
pythonpath = [".."]