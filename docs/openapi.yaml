openapi: 3.0.3
info:
  title: FIN-SENSE API
  description: >
    Vietnamese financial news sentiment API.
    Measures news-coverage tone only — not a buy/sell/hold signal.
  version: "1.0.0"

servers:
  - url: https://finsense-api.onrender.com/api
    description: Production (Render)
  - url: http://localhost:8000/api
    description: Local development

security: []

tags:
  - name: dashboard
    description: Public dashboard endpoints
  - name: ticker
    description: Ticker detail endpoints
  - name: audit
    description: Admin audit panel endpoints (JWT required)
  - name: auth
    description: Authentication

paths:

  # ─────────────────────────────────────────
  # DASHBOARD
  # ─────────────────────────────────────────

  /dashboard/summary:
    get:
      tags: [dashboard]
      summary: Dashboard metric cards
      description: >
        Global counts and the system-wide last-updated timestamp.
        Deliberately window-independent — these are totals, not window slices,
        so the cards do not flicker when the user changes the gauge window.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '500':
          $ref: '#/components/responses/ServerError'

  /dashboard/gauge:
    get:
      tags: [dashboard]
      summary: Fear & Greed gauge for the selected window
      parameters:
        - $ref: '#/components/parameters/window'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardGauge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /dashboard/events:
    get:
      tags: [dashboard]
      summary: Top events in the window, ranked by article volume
      description: >
        Kept separate from /dashboard/tickers rather than merged behind a sort
        param: the two payloads share no fields and are rendered by unrelated
        widgets, so a polymorphic union would only force a discriminated type on
        every consumer for no gain.
      parameters:
        - $ref: '#/components/parameters/window'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEvents'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /dashboard/tickers:
    get:
      tags: [dashboard]
      summary: Top tickers in the window, ranked by event volume
      parameters:
        - $ref: '#/components/parameters/window'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTickers'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─────────────────────────────────────────
  # TICKER DETAIL
  # ─────────────────────────────────────────

  /ticker/{symbol}:
    get:
      tags: [ticker]
      summary: Ticker identity card + live sentiment gauge
      description: >
        Company info and live S_final for the selected window, computed at
        request time from event_clusters — not from daily_sentiment_history.
        An unknown symbol is a 404, never a 200 with a zero score, so the
        client can tell it apart from a genuinely quiet ticker. Lowercase
        input is accepted and upper-cased server-side.
      parameters:
        - $ref: '#/components/parameters/symbol'
        - $ref: '#/components/parameters/window'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  # Path param is {ticker} on this one route only, by request; the FS-37 routes
  # use {symbol}. Worth unifying next time this file is touched.
  /ticker/{ticker}/sentiment:
    get:
      tags: [ticker]
      summary: Live S_final for one ticker
      description: >
        Score is computed at request time from event_clusters — not from
        daily_sentiment_history. An unknown symbol is a 404, never a 200 with a
        zero score, so the client can tell it apart from a genuinely quiet ticker.
        Lowercase input is accepted and upper-cased server-side.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ticker'
          example: HPG
        - $ref: '#/components/parameters/window'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerSentiment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'


  /ticker/{symbol}/history:
    get:
      tags: [ticker]
      summary: EOD sentiment + price history for dual-axis chart
      description: >
        Returns daily sentiment scores and closing prices from daily_sentiment_history.
        Used for the 7d/30d/90d chart on the ticker detail page.
      parameters:
        - $ref: '#/components/parameters/symbol'
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid days value (must be one of 7/30/90)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /ticker/{symbol}/events:
    get:
      tags: [ticker]
      summary: Recent events mentioning this ticker
      description: >
        Returns a paginated list of events that mention the ticker, newest
        first — the ticker's full event history, NOT scoped to the
        24h/48h/72h window (that window only applies to the live S_final
        gauge on GET /ticker/{symbol}). Page 2, 3, ... keeps going back as
        far as event_clusters has data for this ticker.
      parameters:
        - $ref: '#/components/parameters/symbol'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerEvents'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: page < 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────

  /auth/login:
    post:
      tags: [auth]
      summary: Admin login — returns JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────
  # AUDIT
  # ─────────────────────────────────────────

  /audit/events:
    get:
      tags: [audit]
      summary: Audit event queue — unaudited first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditQueue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /audit/events/{cluster_id}/{source}:
    patch:
      tags: [audit]
      summary: Approve or correct a source entry within an event
      description: >
        Approves or corrects the AI extraction for one source within a cluster.
        On correct — updates scores directly on event_clusters source_breakdown,
        flips is_audited to true, writes immutable record to audit_log.
        On approve — flips is_audited to true, writes to audit_log with no score changes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/cluster_id'
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [CafeF, VnExpress]
          description: >
            Matches backend.core.config.pipeline_settings.RSS_FEEDS — update this
            enum if a source is added or removed there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditAction'
      responses:
        '200':
          description: Audit action recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cluster_id:
                    type: string
                  source:
                    type: string
                  action_type:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /audit/log:
    get:
      tags: [audit]
      summary: Immutable audit history log
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

# ─────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    window:
      name: window
      in: query
      required: false
      schema:
        type: string
        enum: [24h, 48h, 72h]
        default: 24h
      description: Rolling time window for live sentiment computation

    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for paginated results (5 items per page)

    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 5
      description: Page size. Defaults come from APISettings.DEFAULT_*_LIMIT.

    symbol:
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ticker'
      example: HPG
      description: Ticker symbol (uppercase)

    cluster_id:
      name: cluster_id
      in: path
      required: true
      schema:
        type: string
        example: evt_hpg_q2_2026

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Action not permitted for this account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: >
        Query or path parameter failed validation. FastAPI's native shape —
        a `detail` array, not the `Error` object — so clients must not assume
        `Error` here.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object

  schemas:

    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string

    SentimentScore:
      type: number
      format: float
      minimum: -1.0
      maximum: 1.0
      nullable: true
      description: Continuous sentiment score. null means no valid events in window.

    # Frozen vocabularies — kept in sync by hand with backend/core/enums.py.
    # These are closed sets on purpose: historical sentiment records are labeled
    # against this exact vocabulary. Do not add/remove values here without a
    # corresponding backend enum change.

    Ticker:
      type: string
      description: VN30 ticker symbol. Mirrors backend/core/enums.py::Ticker.
      enum:
        - ACB
        - BID
        - BSR
        - CTG
        - FPT
        - GAS
        - GVR
        - HDB
        - HPG
        - LPB
        - MBB
        - MCH
        - MSN
        - MWG
        - SAB
        - SHB
        - SSB
        - SSI
        - STB
        - TCB
        - TCX
        - VCB
        - VHM
        - VIB
        - VIC
        - VJC
        - VNM
        - VPB
        - VPL
        - VRE

    Concept:
      type: string
      description: Macro/sector concept taxonomy. Mirrors backend/core/enums.py::Concept.
      enum:
        - BANKING
        - CONSUMER_DISCRETIONARY
        - CONSUMER_STAPLES
        - ENERGY
        - INDUSTRIALS
        - MACRO
        - MATERIALS
        - REAL_ESTATE
        - SECURITIES
        - TECHNOLOGY

    # ── Dashboard ──

    DashboardSummary:
      type: object
      required: [total_tickers, total_articles, total_events, last_updated]
      properties:
        total_tickers:
          type: integer
          description: len(backend/core/enums.py::Ticker). Not read from the DB.
        total_articles:
          type: integer
        total_events:
          type: integer
        last_updated:
          type: string
          format: date-time
          nullable: true
          description: Newest event_clusters.updated_at. null when the DB is empty.

    DashboardGauge:
      type: object
      required:
        [window, market_score, is_empty, positive_count, neutral_count,
         negative_count, scored_events, total_events_in_window]
      properties:
        window:
          type: string
          example: 24h
        market_score:
          type: number
          format: float
          minimum: -1.0
          maximum: 1.0
          description: >
            0.0 when is_empty is true. Read is_empty before rendering — a 0.0
            empty state and a genuinely neutral 0.0 must not look alike.
        is_empty:
          type: boolean
          description: true if no scoreable event in the window.
        positive_count:
          type: integer
        neutral_count:
          type: integer
        negative_count:
          type: integer
        scored_events:
          type: integer
          description: Events folded into market_score. Equals the three bucket counts summed.
        total_events_in_window:
          type: integer
          description: >
            All events in the window, including ones with no score yet. Use this
            for "N events" copy — the bucket counts undercount it.

    DashboardEvents:
      type: object
      required: [window, page, limit, has_more, events]
      properties:
        window:
          type: string
        page:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventFeedItem'

    DashboardTickers:
      type: object
      required: [window, page, limit, has_more, tickers]
      properties:
        window:
          type: string
        page:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        tickers:
          type: array
          items:
            $ref: '#/components/schemas/TickerFeedItem'

    TickerFeedItem:
      type: object
      required: [rank, ticker, event_count, sentiment_score, is_empty]
      properties:
        rank:
          type: integer
          description: Global 1-based rank, already offset by page.
        ticker:
          $ref: '#/components/schemas/Ticker'
        event_count:
          type: integer
        sentiment_score:
          type: number
          format: float
          minimum: -1.0
          maximum: 1.0
        is_empty:
          type: boolean

    EventFeedItem:
      type: object
      required:
        [rank, cluster_id, event_title, total_articles, sources, tickers_mentioned]
      properties:
        rank:
          type: integer
          description: Global 1-based rank, already offset by page.
        cluster_id:
          type: string
        event_title:
          type: string
        total_articles:
          type: integer
        sources:
          type: object
          additionalProperties:
            type: integer
          description: >
            Article count keyed by source name, derived from
            event_coverage.all_urls. Currently CafeF and VnExpress (see
            backend/core/config.py::PipelineSettings.RSS_FEEDS) — a newly
            registered scraper source appears here with no contract change.
          example:
            CafeF: 3
            VnExpress: 1
        tickers_mentioned:
          type: array
          items:
            $ref: '#/components/schemas/Ticker'
          description: Filtered against the Ticker enum; unknown symbols are dropped.

    # ── Ticker Detail ──

    TickerSentiment:
      type: object
      required: [ticker, window, score, is_empty]
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        window:
          type: string
        score:
          $ref: '#/components/schemas/SentimentScore'
          description: >
            S_final. null when is_empty is true — 0.0 is a legitimate neutral
            score and must not double as "no data".
        is_empty:
          type: boolean
          description: true if no valid events in window — UI shows neutral grey gauge.

    TickerDetail:
      type: object
      required:
        [ticker, company_name, window, sentiment_score, gauge, article_count,
         event_count, last_updated, is_empty_state]
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        company_name:
          type: string
          description: >
            display_name from backend/core/ticker_metadata.py — resolves the
            TODO that used to sit here (see TickerFeedItem.company_name, still
            open for the dashboard feed).
        window:
          type: string
        sentiment_score:
          $ref: '#/components/schemas/SentimentScore'
        gauge:
          type: object
          properties:
            score:
              $ref: '#/components/schemas/SentimentScore'
            positive_count:
              type: integer
            neutral_count:
              type: integer
            negative_count:
              type: integer
        article_count:
          type: integer
          description: Total event_coverage.total_articles across events mentioning this ticker in the window
        event_count:
          type: integer
          description: Count of events mentioning this ticker in the window
        last_updated:
          type: string
          format: date-time
          nullable: true
          description: Most recent updated_at among events mentioning this ticker — null if none
        is_empty_state:
          type: boolean
          description: true if no valid events in window — UI shows neutral grey gauge.

    TickerHistory:
      type: object
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        days:
          type: integer
          description: The requested range (7/30/90) — NOT the number of rows actually returned. See data.
        data:
          type: array
          description: >
            Oldest -> newest, one row per calendar day that exists in
            daily_sentiment_history. Can be shorter than `days` if the EOD
            batch hasn't run that many times yet — not an error. Nulls in
            either field pass through untouched: no interpolation, no gap-filling.
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2026-06-27"
              daily_sentiment_score:
                $ref: '#/components/schemas/SentimentScore'
              closing_price:
                type: number
                nullable: true

    TickerEvents:
      type: object
      properties:
        ticker:
          $ref: '#/components/schemas/Ticker'
        page:
          type: integer
        has_more:
          type: boolean
        items:
          type: array
          items:
            type: object
            properties:
              cluster_id:
                type: string
              event_title:
                type: string
              created_at:
                type: string
                format: date-time
              article_count:
                type: integer
                description: event_coverage.total_articles — articles ingested, higher than len(source_breakdown) by design
              sentiment_score:
                $ref: '#/components/schemas/SentimentScore'
                description: This ticker's entry from aggregated_analysis.ticker_sentiments — null if no source cleared AI_CONFIDENCE_THRESHOLD
              source_breakdown:
                type: array
                description: >
                  One row per source (not per article — each source contributes
                  exactly one representative ai_response). Sources below
                  AI_CONFIDENCE_THRESHOLD are excluded entirely, not shown with a
                  null/greyed score.
                items:
                  type: object
                  properties:
                    source:
                      type: string
                      example: CafeF
                    score:
                      type: number
                      format: float
                      minimum: -1.0
                      maximum: 1.0
                      description: This source's own score for this ticker, from source_breakdown[].ai_response.ticker_sentiments[]
                    article_title:
                      type: string
                      description: >
                        TODO: representative_article does not persist its own
                        title yet (see backend/core/schemas/event_cluster.py::
                        RepresentativeArticle) — falls back to the cluster's
                        event_title until the pipeline stores one per article.
                    article_url:
                      type: string

    # ── Audit ──

    AuditAction:
      type: object
      required: [action_type]
      properties:
        action_type:
          type: string
          enum: [approve, correct]
        error_type:
          type: string
          nullable: true
          description: Required when action_type is correct
          enum:
            - No error
            - Wrong magnitude
            - Wrong direction
            - Wrong ticker
            - Missed ticker
        corrected_ticker_sentiments:
          type: array
          nullable: true
          description: Only include tickers being corrected — not the full list
          items:
            type: object
            properties:
              ticker:
                $ref: '#/components/schemas/Ticker'
              score:
                $ref: '#/components/schemas/SentimentScore'
        corrected_concept_sentiments:
          type: array
          nullable: true
          description: Only include concepts being corrected — not the full list
          items:
            type: object
            properties:
              concept:
                $ref: '#/components/schemas/Concept'
              score:
                $ref: '#/components/schemas/SentimentScore'

    AuditQueue:
      type: object
      properties:
        page:
          type: integer
        has_more:
          type: boolean
        total_pending:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              cluster_id:
                type: string
              event_title:
                type: string
              created_at:
                type: string
                format: date-time
              source_breakdown:
                type: array
                items:
                  type: object
                  properties:
                    source:
                      type: string
                    is_audited:
                      type: boolean
                    ai_confidence:
                      type: number
                    ticker_sentiments:
                      type: array
                      items:
                        type: object
                        properties:
                          ticker:
                            $ref: '#/components/schemas/Ticker'
                          score:
                            $ref: '#/components/schemas/SentimentScore'
                    concept_sentiments:
                      type: array
                      items:
                        type: object
                        properties:
                          concept:
                            $ref: '#/components/schemas/Concept'
                          score:
                            $ref: '#/components/schemas/SentimentScore'

    AuditLog:
      type: object
      properties:
        page:
          type: integer
        has_more:
          type: boolean
        items:
          type: array
          items:
            type: object
            properties:
              cluster_id:
                type: string
              source:
                type: string
              admin_id:
                type: string
              admin_name:
                type: string
              action_type:
                type: string
              error_type:
                type: string
                nullable: true
              old_ticker_sentiments:
                type: array
                items:
                  type: object
                  properties:
                    ticker:
                      $ref: '#/components/schemas/Ticker'
                    score:
                      $ref: '#/components/schemas/SentimentScore'
              new_ticker_sentiments:
                type: array
                nullable: true
                items:
                  type: object
                  properties:
                    ticker:
                      $ref: '#/components/schemas/Ticker'
                    score:
                      $ref: '#/components/schemas/SentimentScore'
              old_concept_sentiments:
                type: array
                items:
                  type: object
                  properties:
                    concept:
