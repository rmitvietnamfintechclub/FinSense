name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.16.1  # keep in sync with uv.lock; unpinned ruff changes default rules under us
      - run: ruff check backend/
